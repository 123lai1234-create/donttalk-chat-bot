services:
  - type: web
    name: donttalk-chat-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.fe8.cn/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: SITE_URL
        value: https://donttalk.vercel.app
      - key: SITE_NAME
        value: donttalk
      - key: ALLOWED_ORIGINS
        value: https://donttalk.vercel.app,http://localhost:4321
      - key: LOG_LEVEL
        value: INFO
